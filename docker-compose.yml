version: '3.8'

services:
  # Databases
  mysql:
    image: mysql:8.0
    container_name: jee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: jee_portal
      MYSQL_USER: jee_user
      MYSQL_PASSWORD: jee_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jee-network
    command: --default-authentication-plugin=mysql_native_password

  mongodb:
    image: mongo:7
    container_name: jee-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: jee_user
      MONGO_INITDB_ROOT_PASSWORD: jee_password
      MONGO_INITDB_DATABASE: jee_portal
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - jee-network

  redis:
    image: redis:7-alpine
    container_name: jee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jee-network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jee-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: jee_user
      RABBITMQ_DEFAULT_PASS: jee_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - jee-network

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: jee-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/sites-available:/etc/nginx/sites-available
    depends_on:
      - api-gateway
    networks:
      - jee-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: jee-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - jee-network

  grafana:
    image: grafana/grafana:latest
    container_name: jee-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - jee-network

  # Laravel Services
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: jee-api-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/api-gateway:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: jee-auth-service
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/auth-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: jee-user-service
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/user-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  exam-service:
    build:
      context: ./services/exam-service
      dockerfile: Dockerfile
    container_name: jee-exam-service
    ports:
      - "8003:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=jee_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - mongodb
      - redis
    volumes:
      - ./services/exam-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  question-service:
    build:
      context: ./services/question-service
      dockerfile: Dockerfile
    container_name: jee-question-service
    ports:
      - "8004:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=jee_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./services/question-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  submission-service:
    build:
      context: ./services/submission-service
      dockerfile: Dockerfile
    container_name: jee-submission-service
    ports:
      - "8005:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_KEY=base64:your-app-key-here
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=jee_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=jee_user
      - RABBITMQ_PASS=jee_password
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./services/submission-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  # Native PHP Services
  evaluation-service:
    build:
      context: ./services/evaluation-service
      dockerfile: Dockerfile
    container_name: jee-evaluation-service
    ports:
      - "8006:80"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=jee_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - mongodb
      - redis
    volumes:
      - ./services/evaluation-service:/var/www/html
    networks:
      - jee-network

  proctor-service:
    build:
      context: ./services/proctor-service
      dockerfile: Dockerfile
    container_name: jee-proctor-service
    ports:
      - "8007:80"
    environment:
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=jee_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./services/proctor-service:/var/www/html
    networks:
      - jee-network

  # Queue Workers
  queue-worker:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: jee-queue-worker
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      - APP_ENV=development
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=jee_portal
      - DB_USERNAME=jee_user
      - DB_PASSWORD=jee_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/api-gateway:/var/www/html
      - /var/www/html/vendor
    networks:
      - jee-network

  # Frontend Applications
  student-portal:
    build:
      context: ./frontend/student-portal
      dockerfile: Dockerfile
    container_name: jee-student-portal
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend/student-portal:/app
      - /app/node_modules
    networks:
      - jee-network

  admin-portal:
    build:
      context: ./frontend/admin-portal
      dockerfile: Dockerfile
    container_name: jee-admin-portal
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend/admin-portal:/app
      - /app/node_modules
    networks:
      - jee-network

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  jee-network:
    driver: bridge